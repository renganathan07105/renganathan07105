name: update-metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          base: header, community, metadata
          output_condition: always
          plugins_errors_fatal: no
          committer_branch: main
          committer_message: "chore: update GitHub metrics"
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          # activity + achievements disabled: upstream lowlighter/metrics bugs
          # (activity: crashes on PushEvent with undefined commits; achievements:
          #  queries Projects-classic which GitHub deprecated -> always errors)
