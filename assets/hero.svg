<svg width="1000" height="330" viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Renganathan hero banner with animated terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#010409"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#BC8CFF;#3FB950;#58A6FF" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3FB950">
        <animate attributeName="stop-color" values="#3FB950;#58A6FF;#BC8CFF;#3FB950" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#30363D" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1000" height="330" fill="url(#bg)"/>
  <rect width="1000" height="330" fill="url(#dots)"/>
  <rect width="1000" height="330" fill="url(#glow)"/>

  <!-- floating particles -->
  <g>
    <circle cx="140" cy="40" r="2" fill="#58A6FF"><animate attributeName="cy" values="320;30" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="40" r="1.5" fill="#BC8CFF"><animate attributeName="cy" values="320;40" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="40" r="1.5" fill="#58A6FF"><animate attributeName="cy" values="320;60" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="40" r="2" fill="#3FB950"><animate attributeName="cy" values="330;30" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="40" r="1.5" fill="#58A6FF"><animate attributeName="cy" values="320;50" dur="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="40" r="2" fill="#BC8CFF"><animate attributeName="cy" values="320;30" dur="8.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8.5s" repeatCount="indefinite"/></circle>
    <circle cx="970" cy="40" r="1.5" fill="#58A6FF"><animate attributeName="cy" values="330;40" dur="9.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9.5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="40" r="1.5" fill="#3FB950"><animate attributeName="cy" values="320;70" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="40" r="1.5" fill="#3FB950"><animate attributeName="cy" values="320;45" dur="8.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="8.2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="40" r="1.5" fill="#58A6FF"><animate attributeName="cy" values="320;55" dur="6.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="6.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- LEFT: identity -->
  <text x="70" y="92" font-family="'Courier New', monospace" font-size="13" fill="#3FB950" letter-spacing="2">~/profile $ whoami</text>

  <text x="70" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="url(#grad)" letter-spacing="3">RENGANATHAN</text>

  <text x="70" y="202" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#C9D1D9">
    <tspan>Software Developer · Problem Solver · Lifelong Learner</tspan>
    <tspan fill="#58A6FF"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/> &#9608;</tspan>
  </text>

  <text x="70" y="246" font-family="'Courier New', monospace" font-size="14" fill="#8B949E">$ git commit --message &quot;always building&quot;</text>

  <!-- status pills -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
    <rect x="70" y="270" width="152" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
    <text x="146" y="289" text-anchor="middle" fill="#58A6FF">&#9679; Open to work</text>
    <rect x="234" y="270" width="128" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
    <text x="298" y="289" text-anchor="middle" fill="#3FB950">&#9679; OSS</text>
    <rect x="374" y="270" width="152" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
    <text x="450" y="289" text-anchor="middle" fill="#BC8CFF">&#9679; Learning</text>
  </g>

  <!-- RIGHT: animated terminal card -->
  <g>
    <rect x="600" y="52" width="330" height="236" rx="14" fill="#0D1117" fill-opacity="0.9" stroke="#30363D"/>
    <line x1="600" y1="86" x2="930" y2="86" stroke="#30363D"/>
    <circle cx="622" cy="69" r="6" fill="#FF5F56"/>
    <circle cx="642" cy="69" r="6" fill="#FFBD2E"/>
    <circle cx="662" cy="69" r="6" fill="#27C93F"/>
    <text x="690" y="74" font-family="'Courier New', monospace" font-size="12" fill="#8B949E">zsh — renganathan07105</text>

    <g font-family="'Courier New', monospace" font-size="13">
      <text x="620" y="112" fill="#8B949E" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.14;1" dur="9s" repeatCount="indefinite"/>$ whoami</text>
      <text x="620" y="134" fill="#C9D1D9" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.24;1" dur="9s" repeatCount="indefinite"/>Renganathan — software developer</text>
      <text x="620" y="160" fill="#8B949E" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.33;0.37;1" dur="9s" repeatCount="indefinite"/>$ ls ./skills</text>
      <text x="620" y="182" fill="#C9D1D9" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.43;0.47;1" dur="9s" repeatCount="indefinite"/>typescript react node docker git</text>
      <text x="620" y="208" fill="#8B949E" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.6;1" dur="9s" repeatCount="indefinite"/>$ status --projects</text>
      <text x="620" y="230" fill="#3FB950" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.7;1" dur="9s" repeatCount="indefinite"/>building: full-stack apps &#10003;</text>
      <text x="620" y="260" fill="#58A6FF" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;1;0;1" keyTimes="0;0.66;0.72;0.8;0.88;0.96;1" dur="9s" repeatCount="indefinite"/>
        &#9608;
      </text>
    </g>
  </g>
</svg>
