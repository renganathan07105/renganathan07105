<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Renganathan hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#010409"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#BC8CFF;#3FB950;#58A6FF" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3FB950">
        <animate attributeName="stop-color" values="#3FB950;#58A6FF;#BC8CFF;#3FB950" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#glow)"/>

  <!-- decorative code braces -->
  <text x="70" y="72" font-family="'Courier New', monospace" font-size="58" font-weight="700" fill="#21262D">{</text>
  <text x="918" y="242" font-family="'Courier New', monospace" font-size="58" font-weight="700" fill="#21262D">}</text>

  <!-- name -->
  <text x="500" y="135" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="url(#grad)" letter-spacing="4">RENGANATHAN</text>

  <!-- subtitle with blinking cursor -->
  <text x="500" y="185" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#C9D1D9">
    <tspan>Software Developer · Problem Solver · Lifelong Learner</tspan>
    <tspan fill="#58A6FF"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/> &#9608;</tspan>
  </text>

  <!-- terminal line -->
  <text x="500" y="232" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#8B949E">$ git commit --message &quot;always building&quot;</text>

  <line x1="130" y1="258" x2="870" y2="258" stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <text x="500" y="283" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#484F58" letter-spacing="3">CODE · CREATE · INNOVATE</text>
</svg>
