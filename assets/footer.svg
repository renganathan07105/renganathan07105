<svg width="1000" height="160" viewBox="0 0 1000 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thanks for visiting">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#BC8CFF"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
  </defs>

  <!-- pulsing glow behind heart -->
  <circle cx="500" cy="52" r="16" fill="#58A6FF">
    <animate attributeName="r" values="13;24;13" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0;0.25" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- heart -->
  <path d="M500 32 C500 32 483 45 483 56 C483 64 491 71 500 71 C509 71 517 64 517 56 C517 45 500 32 500 32 Z" fill="url(#g)"/>

  <text x="500" y="108" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#C9D1D9">Thanks for stopping by — let&apos;s build something great together</text>

  <!-- animated wave -->
  <path d="M0 150 Q 125 138 250 150 T 500 150 T 750 150 T 1000 150 V 160 H 0 Z" fill="url(#g)" opacity="0.3">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" values="
      M0 150 Q 125 138 250 150 T 500 150 T 750 150 T 1000 150 V 160 H 0 Z;
      M0 150 Q 125 162 250 150 T 500 150 T 750 150 T 1000 150 V 160 H 0 Z;
      M0 150 Q 125 138 250 150 T 500 150 T 750 150 T 1000 150 V 160 H 0 Z"/>
  </path>
</svg>
